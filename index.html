<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDDC Live Bracket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Montserrat:wght@500;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f16;
      --header-bg: #000000;
      --iddc-red: #d3003c;
      --card-bg: rgba(15, 19, 25, 0.85);
      --card-border: #1f2937;
      --win-green: #10b981;
      --lose-red: #f43f5e;
      --text-main: #ffffff;
      --text-muted: #6b7280;
      --grid-line: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Фоновая клетка из референса */
    body::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px; z-index: -1;
    }

    /* =========================================================
       ШАПКА ТРАНСЛЯЦИИ
       ========================================================= */
    header {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--iddc-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      height: 64px;
    }

    .head-left { display: flex; align-items: center; gap: 16px; }
    .iddc-logo {
      background: #000; border: 2px solid var(--iddc-red);
      padding: 2px 10px; transform: skewX(-15deg);
      box-shadow: 0 0 10px rgba(211, 0, 60, 0.3);
    }
    .iddc-logo span { display: block; font-family: 'Russo One', sans-serif; color: var(--iddc-red); font-size: 24px; transform: skewX(15deg); letter-spacing: 1px; }
    .head-titles { display: flex; flex-direction: column; }
    .title-ru { font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
    .title-en { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 9px; color: var(--text-muted); letter-spacing: 1px; }

    .head-right { display: flex; align-items: center; gap: 24px; }
    .brand-igora { display: flex; align-items: center; gap: 6px; }
    .brand-igora .cursive { font-family: 'Georgia', serif; font-style: italic; font-size: 20px; }
    .brand-igora .bold { font-weight: 900; font-size: 11px; color: var(--iddc-red); letter-spacing: 1px; }
    
    .brand-matsuri { display: flex; flex-direction: column; align-items: center; line-height: 1; transform: rotate(-3deg); }
    .brand-matsuri span:first-child { font-family: 'Russo One', sans-serif; font-size: 10px; color: #ffeb3b; }
    .brand-matsuri span:last-child { font-family: 'Russo One', sans-serif; font-size: 14px; color: #e91e63; }
    
    .brand-kf { font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 14px; font-style: italic; letter-spacing: 1px; border-left: 1px solid #333; padding-left: 16px;}

    /* =========================================================
       ПАНЕЛЬ УПРАВЛЕНИЯ
       ========================================================= */
    .sub-nav {
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      padding: 0 24px;
    }
    .tabs-left { display: flex; height: 100%; }
    .tab-btn {
      background: transparent; color: var(--text-muted); border: none; padding: 0 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; height: 100%;
    }
    .tab-btn.active { background: var(--iddc-red); color: #fff; }
    
    .tabs-right { display: flex; align-items: center; gap: 8px; }
    .tabs-right span { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-right: 8px;}
    .ctrl-btn {
      background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 4px 12px; font-size: 9px; font-weight: 800; cursor: pointer; border-radius: 3px;
    }
    .ctrl-btn.active { border-color: var(--iddc-red); color: var(--iddc-red); }

    /* =========================================================
       СЕТКА ХИТОВ
       ========================================================= */
    .board {
      flex: 1; padding: 24px; display: flex; gap: 20px;
    }
    .round-col { flex: 1; display: flex; flex-direction: column; gap: 12px; transition: 0.4s; }
    .round-title { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; color: #fff; text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--card-border); margin-bottom: 4px; }

    .heat-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 4px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s;
    }
    .heat-card:hover { border-color: #3b82f6; }
    .heat-header {
      background: rgba(0,0,0,0.5); padding: 4px 10px; font-family: 'Chakra Petch', sans-serif; font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--card-border); text-transform: uppercase;
    }
    .pilot-row {
      display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); position: relative;
    }
    .pilot-row:last-child { border-bottom: none; }
    .pilot-row.winner { background: rgba(16, 185, 129, 0.12); }
    .pilot-row.winner::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--win-green); }
    .pilot-row.loser { opacity: 0.4; }

    .pilot-seed { font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; color: var(--text-muted); width: 26px; }
    .pilot-name { font-size: 13px; font-weight: 700; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win-badge { font-family: 'Chakra Petch', sans-serif; font-size: 10px; font-weight: 800; color: var(--win-green); border: 1px solid var(--win-green); padding: 2px 4px; border-radius: 2px; }

    /* =========================================================
       ОВЕРЛЕЙ ПОБЕДИТЕЛЯ
       ========================================================= */
    .popup-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 7, 12, 0.92); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .popup-overlay.active { opacity: 1; pointer-events: all; }

    .popup-box {
      background: #11151c; border: 2px solid #fbbf24; width: 840px; padding: 40px 50px; border-radius: 8px; text-align: center; box-shadow: 0 0 60px rgba(251, 191, 36, 0.15); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
    }
    .popup-overlay.active .popup-box { transform: scale(1); }
    
    .pop-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #6b7280; font-size: 20px; cursor: pointer; }
    .pop-close:hover { color: #fff; }

    .pop-subtitle { font-family: 'Chakra Petch', sans-serif; font-size: 12px; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; font-weight: 700;}
    .pop-title { font-family: 'Russo One', sans-serif; font-size: 48px; color: #fff; text-transform: uppercase; margin-bottom: 30px; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .pop-split { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--card-border); padding-top: 24px; margin-bottom: 24px; }
    .pop-side { display: flex; flex-direction: column; width: 40%; }
    .pop-label { font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .pop-label.win { color: var(--win-green); }
    .pop-label.lose { color: var(--lose-red); }
    .pop-name { font-size: 20px; font-weight: 800; color: #fff; }
    .pop-vs { font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 22px; color: var(--text-muted); }

    .timer-line { width: 100%; height: 4px; background: #222; overflow: hidden; border-radius: 2px; }
    .timer-progress { height: 100%; background: #fbbf24; width: 100%; }
    .timer-progress.run { animation: shrink 10s linear forwards; }
    @keyframes shrink { to { width: 0%; } }

    #sync-status { position: fixed; bottom: 8px; right: 16px; font-size: 10px; color: var(--text-muted); z-index: 100; font-family: 'Chakra Petch', sans-serif; }
  </style>
</head>
<body>

  <header>
    <div class="head-left">
      <div class="iddc-logo"><span>IDDC</span></div>
      <div class="head-titles">
        <div class="title-ru">«Игора Драйв Дрифт-Вызов»</div>
        <div class="title-en">IGORA DRIVE DRIFT CHALLENGE</div>
      </div>
    </div>
    <div class="head-right">
      <div class="brand-igora"><span class="cursive">Игора</span><span class="bold">ДРАЙВ</span></div>
      <div class="brand-matsuri"><span>ДРИФТ</span><span>МАЦУРИ</span></div>
      <div class="brand-kf">KINFOREST</div>
    </div>
  </header>

  <div class="sub-nav">
    <div class="tabs-left">
      <button class="tab-btn active">СЕТКА СУББОТА (SAT 32DE)</button>
      <button class="tab-btn">СЕТКА ВОСКРЕСЕНЬЕ (SUN 32DE)</button>
    </div>
    <div class="tabs-right">
      <span>КАМЕРА:</span>
      <button class="ctrl-btn active">ВЕРХНЯЯ СЕТКА</button>
      <button class="ctrl-btn">НИЖНЯЯ СЕТКА</button>
      <button class="ctrl-btn" id="btn-auto" onclick="toggleAuto()">АВТО: ВЫКЛ</button>
    </div>
  </div>

  <main class="board" id="bracket-board"></main>

  <div id="sync-status">Синхронизация...</div>

  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <button class="pop-close" onclick="closePopup()">✖</button>
      <div class="pop-subtitle" id="pop-heat">РЕЗУЛЬТАТ ЗАЕЗДА</div>
      <div class="pop-title" id="pop-winner">ИМЯ ПИЛОТА</div>
      <div class="pop-split">
        <div class="pop-side">
          <span class="pop-label win">ПРОХОДИТ ДАЛЬШЕ</span>
          <span class="pop-name" id="pop-p1">Пилот 1</span>
        </div>
        <div class="pop-vs">VS</div>
        <div class="pop-side">
          <span class="pop-label lose">В НИЖНЮЮ СЕТКУ</span>
          <span class="pop-name" id="pop-p2">Пилот 2</span>
        </div>
      </div>
      <div class="timer-line"><div class="timer-progress" id="pop-timer"></div></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // НАСТРОЙКИ СЕТКИ (УКАЖИТЕ СТОЛБЦЫ И СТРОКИ ИЗ ВАШЕГО EXCEL)
    // =========================================================================
    const SPREADSHEET_ID = '1ydV36JHtw8T00uJwsZYAxU-tCaWIrQv5yPkKpqtCtTk';
    
    // col - номер столбца с именами пилотов (A=0, B=1, C=2, D=3, E=4...)
    // winCol - номер столбца с буквой 'w' (обычно соседний справа от имени)
    // r1, r2 - номера строк пилотов минус 1 (т.е. если Пилот в 9 строке, пишем 8)
    const SAT_TOP_CONFIG = [
      {
        title: "РАУНД 1А", col: 3, winCol: 4, // Колонки D и E
        heats: [
          { id: "Хит 1", r1: 8, r2: 10 },
          { id: "Хит 2", r1: 12, r2: 14 },
          { id: "Хит 3", r1: 16, r2: 18 },
          { id: "Хит 4", r1: 20, r2: 22 },
          { id: "Хит 5", r1: 24, r2: 26 },
          { id: "Хит 6", r1: 28, r2: 30 },
          { id: "Хит 7", r1: 32, r2: 34 },
          { id: "Хит 8", r1: 36, r2: 38 }
        ]
      },
      {
        title: "РАУНД 3А", col: 8, winCol: 9, // Колонки I и J
        heats: [
          { id: "Хит 25", r1: 9, r2: 13 },
          { id: "Хит 26", r1: 17, r2: 21 },
          { id: "Хит 27", r1: 25, r2: 29 },
          { id: "Хит 28", r1: 33, r2: 37 }
        ]
      },
      {
        title: "РАУНД 3Б", col: 21, winCol: 22, // Колонки V и W
        heats: [
          { id: "Хит 29", r1: 9, r2: 13 },
          { id: "Хит 30", r1: 17, r2: 21 },
          { id: "Хит 31", r1: 25, r2: 29 },
          { id: "Хит 32", r1: 33, r2: 37 }
        ]
      },
      {
        title: "РАУНД 1Б", col: 26, winCol: 27, // Колонки AA и AB
        heats: [
          { id: "Хит 9", r1: 8, r2: 10 },
          { id: "Хит 10", r1: 12, r2: 14 },
          { id: "Хит 11", r1: 16, r2: 18 },
          { id: "Хит 12", r1: 20, r2: 22 },
          { id: "Хит 13", r1: 24, r2: 26 },
          { id: "Хит 14", r1: 28, r2: 30 },
          { id: "Хит 15", r1: 32, r2: 34 },
          { id: "Хит 16", r1: 36, r2: 38 }
        ]
      }
    ];

    // =========================================================================
    // ЛОГИКА ТРАНСЛЯЦИИ (МЕНЯТЬ НЕ НУЖНО)
    // =========================================================================
    let knownWinners = {};
    let popupTimer = null;
    let autoZoomEnabled = true;

    // Безопасное получение значения из ячейки
    function getVal(rows, r, c) {
      if (!rows[r] || !rows[r].c || !rows[r].c[c]) return "";
      let v = String(rows[r].c[c].v).trim();
      if (v === "0" || v === "#N/A" || v === "#REF!" || v === "null") return "";
      return v;
    }

    // Проверка на победу (ищем 1 или w)
    function checkWin(val) {
      let v = val.toLowerCase();
      return v === 'w' || v === '1' || v === 'в' || v === 'win';
    }

    function renderBoard(rows) {
      const board = document.getElementById('bracket-board');
      let html = "";
      
      let allR1ACompleted = true;
      let allR1BCompleted = true;

      SAT_TOP_CONFIG.forEach((round, colIndex) => {
        html += `<div class="round-col" id="col-${colIndex}"><div class="round-title">${round.title}</div>`;
        
        round.heats.forEach(heat => {
          let p1Name = getVal(rows, heat.r1, round.col);
          let p1Win = checkWin(getVal(rows, heat.r1, round.winCol));
          
          let p2Name = getVal(rows, heat.r2, round.col);
          let p2Win = checkWin(getVal(rows, heat.r2, round.winCol));

          let winner = null, loser = null;
          if (p1Win && p1Name) { winner = p1Name; loser = p2Name; }
          else if (p2Win && p2Name) { winner = p2Name; loser = p1Name; }

          // Проверка завершенности первых раундов для Авто-Зума
          if (colIndex === 0 && !winner) allR1ACompleted = false;
          if (colIndex === 3 && !winner) allR1BCompleted = false;

          let s1Class = p1Win ? "winner" : (winner ? "loser" : "");
          let s2Class = p2Win ? "winner" : (winner ? "loser" : "");
          let statusText = winner ? "ЗАВЕРШЕН" : "ОЖИДАНИЕ";

          // Если ячейка совсем пустая (нет пилота) - не показываем пустую рамку
          if (!p1Name && !p2Name) return;

          html += `
            <div class="heat-card" onclick="forcePopup('${heat.id}', '${winner || p1Name}', '${loser || p2Name}')">
              <div class="heat-header"><span>${heat.id}</span><span>${statusText}</span></div>
              <div class="pilot-row ${s1Class}"><span class="pilot-seed">P1</span><span class="pilot-name">${p1Name}</span>${p1Win ? '<span class="win-badge">WIN</span>' : ''}</div>
              <div class="pilot-row ${s2Class}"><span class="pilot-seed">P2</span><span class="pilot-name">${p2Name}</span>${p2Win ? '<span class="win-badge">WIN</span>' : ''}</div>
            </div>
          `;

          // Если появился НОВЫЙ победитель -> Вызываем Оверлей
          if (winner) {
            if (knownWinners[heat.id] !== undefined && knownWinners[heat.id] !== winner) {
              forcePopup(heat.id, winner, loser);
            }
            knownWinners[heat.id] = winner;
          } else {
            knownWinners[heat.id] = null;
          }
        });

        html += `</div>`;
      });

      board.innerHTML = html;

      // Авто-зум: скрываем первый раунд, если он полностью сыгран
      if (allR1ACompleted && allR1BCompleted && autoZoomEnabled) {
        document.getElementById('col-0').style.display = 'none';
        document.getElementById('col-3').style.display = 'none';
      }
    }

    function forcePopup(heatId, winner, loser) {
      if (!winner || winner === "") return;

      document.getElementById('pop-heat').innerText = `РЕЗУЛЬТАТ ЗАЕЗДА • ${heatId}`;
      document.getElementById('pop-winner').innerText = winner;
      document.getElementById('pop-p1').innerText = winner;
      document.getElementById('pop-p2').innerText = loser || "Соперник";

      const popup = document.getElementById('popup');
      const timer = document.getElementById('pop-timer');

      timer.classList.remove('run');
      void timer.offsetWidth;
      timer.classList.add('run');
      popup.classList.add('active');

      if (popupTimer) clearTimeout(popupTimer);
      popupTimer = setTimeout(closePopup, 10000);
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }

    let isAutoCam = false;
    function toggleAuto() {
      isAutoCam = !isAutoCam;
      const btn = document.getElementById('btn-auto');
      btn.innerText = isAutoCam ? "АВТО: ВКЛ" : "АВТО: ВЫКЛ";
      btn.style.color = isAutoCam ? "var(--iddc-red)" : "var(--text-muted)";
      btn.style.borderColor = isAutoCam ? "var(--iddc-red)" : "var(--text-muted)";
    }

    async function loadData() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=Sat%2032DE`;
        const res = await fetch(url);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        
        renderBoard(json.table.rows);
        document.getElementById('sync-status').innerText = "Live: Синхронизировано " + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('sync-status').innerText = "Ожидание обновления...";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Инициализируем историю, чтобы не спамить плашками при первой загрузке
      SAT_TOP_CONFIG.forEach(r => r.heats.forEach(h => knownWinners[h.id] = null));
      loadData();
      setInterval(loadData, 2000); // Опрос каждые 2 секунды
    });
  </script>
</body>
</html>
