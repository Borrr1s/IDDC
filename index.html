<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ИГОРА ДРАЙВ ДРИФТ-ВЫЗОВ | Live Broadcast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Montserrat:wght@600;800;900&family=Russo+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090d;
      --bg-card: #0f1319;
      --border-card: #1f2937;
      --iddc-magenta: #b30047;
      --igora-red: #e10600;
      --win-green: #10b981;
      --lose-red: #f43f5e;
      --text-main: #ffffff;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #171d2a 0%, var(--bg-dark) 85%);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Фоновая сетка трансляции */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* ========================================================
       ШАПКА В СТИЛЕ АФИШИ IDDC (БЕЗ ВНЕШНИХ КАРТИНОК)
    ======================================================== */
    header {
      position: relative;
      z-index: 20;
      background: #0d0f12;
      border-bottom: 3px solid var(--iddc-magenta);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    
    /* Логотип IDDC */
    .iddc-logo-box {
      background: #000;
      border: 3px solid var(--iddc-magenta);
      transform: skewX(-15deg);
      padding: 6px 18px;
      box-shadow: 0 0 15px rgba(179, 0, 71, 0.4);
    }
    .iddc-logo-box span {
      display: block;
      font-family: 'Russo One', sans-serif;
      color: var(--iddc-magenta);
      font-size: 32px;
      transform: skewX(15deg);
      letter-spacing: 1px;
    }
    .iddc-title-box { display: flex; flex-direction: column; }
    .iddc-ru { font-family: 'Russo One', sans-serif; font-size: 20px; color: #fff; text-transform: uppercase; }
    .iddc-en { font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 1.5px; }

    .header-right { display: flex; align-items: center; gap: 24px; }
    
    /* Лого Игора Драйв */
    .logo-igora { display: flex; flex-direction: column; align-items: flex-end; }
    .logo-igora .top { font-family: 'Brush Script MT', cursive, sans-serif; font-size: 26px; color: #fff; margin-bottom: -10px; transform: rotate(-4deg); }
    .logo-igora .bot { font-family: 'Chakra Petch', sans-serif; font-size: 13px; color: var(--iddc-magenta); font-weight: 700; letter-spacing: 2px; }

    /* Лого Дрифт Мацури */
    .logo-matsuri { display: flex; flex-direction: column; align-items: center; transform: rotate(-3deg); }
    .logo-matsuri .top { font-family: 'Russo One', sans-serif; font-size: 13px; color: #ffeb3b; text-shadow: 2px 2px 0 #000; margin-bottom: -5px; z-index: 2; }
    .logo-matsuri .bot { font-family: 'Russo One', sans-serif; font-size: 18px; color: #e91e63; text-shadow: 2px 2px 0 #000; }

    /* Лого Kinforest */
    .logo-kf { display: flex; align-items: center; gap: 8px; background: #1a1f26; border-right: 4px solid var(--igora-red); padding: 4px 12px; border-radius: 4px; }
    .logo-kf span { font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 14px; font-style: italic; color: #fff; letter-spacing: 1.5px; }

    /* НАВИГАЦИЯ */
    .nav-bar { position: relative; z-index: 15; display: flex; justify-content: space-between; padding: 12px 24px; background: rgba(10, 13, 18, 0.85); border-bottom: 1px solid var(--border-card); }
    .nav-tabs button { background: #161b22; border: 1px solid var(--border-card); color: var(--text-muted); padding: 8px 20px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
    .nav-tabs button.active { background: var(--iddc-magenta); color: #fff; border-color: var(--iddc-magenta); }
    
    .view-controls button { background: #161b22; border: 1px solid var(--border-card); color: #fff; padding: 6px 14px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; cursor: pointer; transition: 0.2s; }
    .view-controls button.active { background: var(--igora-red); border-color: var(--igora-red); }

    /* КОНТЕЙНЕРЫ ЭКРАНОВ */
    .tab-view { display: none; padding: 20px 30px; position: relative; z-index: 5; flex: 1; }
    .tab-view.active { display: block; }
    
    /* ПЛАВНАЯ СМЕНА СЕТОК */
    .carousel-container { position: relative; width: 100%; min-height: 750px; }
    .carousel-slide { position: absolute; top: 0; left: 0; width: 100%; opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0.6s; }
    .carousel-slide.active { opacity: 1; visibility: visible; position: relative; }

    /* СЕТКА ТУРНИРА */
    .bracket-layout { display: flex; gap: 20px; transition: transform 0.5s ease; }
    .bracket-col { display: flex; flex-direction: column; gap: 12px; flex: 1; transition: opacity 0.5s ease, flex 0.5s ease; }
    
    /* ДИЗАЙН ПАРЫ ПО РЕФЕРЕНСУ (Скрин 2) */
    .match-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 4px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; transition: 0.2s; }
    .match-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
    .match-header { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(0,0,0,0.4); font-size: 10px; font-family: 'Chakra Petch', sans-serif; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-card); }
    
    .match-row { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border-card); position: relative; }
    .match-row:last-child { border-bottom: none; }
    .match-row.winner { background: rgba(16, 185, 129, 0.12); border-left: 3px solid var(--win-green); padding-left: 7px; }
    
    .seed-box { color: var(--text-muted); font-weight: 700; width: 28px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; }
    .pilot-name { color: #fff; font-weight: 700; font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win-tag { font-size: 10px; font-family: 'Chakra Petch', sans-serif; color: var(--win-green); font-weight: bold; border: 1px solid var(--win-green); padding: 1px 4px; border-radius: 2px; }

    /* ========================================================
       ОВЕРЛЕЙ ПОБЕДИТЕЛЯ (Скрин 4)
    ======================================================== */
    .winner-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5, 7, 10, 0.92); backdrop-filter: blur(10px); z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
    .winner-overlay.active { display: flex; opacity: 1; }
    
    .winner-box { width: 90%; max-width: 800px; background: #0f1319; border: 2px solid #ffb800; border-radius: 8px; padding: 30px 40px; text-align: center; box-shadow: 0 0 50px rgba(255, 184, 0, 0.2); position: relative; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25); }
    @keyframes popIn { from { transform: scale(0.9); } to { transform: scale(1); } }
    
    .w-title { font-family: 'Chakra Petch', sans-serif; font-size: 12px; color: #ffb800; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
    .w-hero { font-family: 'Russo One', sans-serif; font-size: 48px; color: #fff; text-transform: uppercase; margin-bottom: 20px; }
    
    .w-duel { display: flex; justify-content: space-around; border-top: 1px solid var(--border-card); padding-top: 20px; margin-bottom: 20px; }
    .w-side { display: flex; flex-direction: column; gap: 4px; }
    .w-label { font-family: 'Chakra Petch', sans-serif; font-size: 11px; text-transform: uppercase; font-weight: bold; }
    .w-label.win { color: var(--win-green); }
    .w-label.lose { color: var(--lose-red); }
    .w-name { font-size: 18px; font-weight: bold; color: #fff; }
    .w-vs { font-family: 'Chakra Petch', sans-serif; font-size: 16px; color: var(--text-muted); align-self: center; }

    /* Полоса таймера закрытия */
    .timer-bar { width: 100%; height: 3px; background: #374151; overflow: hidden; }
    .timer-progress { width: 100%; height: 100%; background: #ffb800; }
    .timer-progress.run { animation: countdown 12s linear forwards; }
    @keyframes countdown { to { width: 0%; } }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header>
    <div class="header-left">
      <div class="iddc-logo-box"><span>IDDC</span></div>
      <div class="iddc-title-box">
        <span class="iddc-ru">«ИГОРА ДРАЙВ ДРИФТ-ВЫЗОВ»</span>
        <span class="iddc-en">IGORA DRIVE DRIFT CHALLENGE</span>
      </div>
    </div>
    <div class="header-right">
      <div class="logo-igora">
        <span class="top">Игора</span>
        <span class="bot">ДРАЙВ</span>
      </div>
      <div class="logo-matsuri">
        <span class="top">ДРИФТ</span>
        <span class="bot">МАЦУРИ</span>
      </div>
      <div class="logo-kf">
        <span>KINFOREST</span>
      </div>
    </div>
  </header>

  <!-- НАВИГАЦИЯ -->
  <div class="nav-bar">
    <div class="nav-tabs">
      <button class="active" onclick="switchTab('tab-sat')">Сетка Суббота (Sat 32DE)</button>
      <button onclick="switchTab('tab-sun')">Сетка Воскресенье (Sun 32DE)</button>
    </div>
    <div class="view-controls">
      <span style="color: var(--text-muted); font-size:11px; margin-right: 10px;">Камера:</span>
      <button id="btn-view-0" class="active" onclick="manualSlide(0)">ВЕРХНЯЯ СЕТКА</button>
      <button id="btn-view-1" onclick="manualSlide(1)">НИЖНЯЯ СЕТКА</button>
      <button onclick="toggleAuto()" id="btn-auto">АВТО: ВКЛ</button>
    </div>
  </div>

  <!-- ЭКРАН СУББОТЫ -->
  <main id="tab-sat" class="tab-view active">
    <div class="carousel-container">
      <!-- Слайд 1: Верхняя сетка (Победители) -->
      <div class="carousel-slide active" id="slide-0">
        <div class="bracket-layout" id="sat-winners-layout">
          <div class="bracket-col" id="col-R1A"></div>
          <div class="bracket-col" id="col-R3A"></div>
          <div class="bracket-col" id="col-R3B"></div>
          <div class="bracket-col" id="col-R1B"></div>
        </div>
      </div>
      <!-- Слайд 2: Нижняя сетка (Проигравшие) -->
      <div class="carousel-slide" id="slide-1">
        <div class="bracket-layout">
          <div class="bracket-col" id="col-R2A"></div>
          <div class="bracket-col" id="col-R2B"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ЭКРАН ВОСКРЕСЕНЬЯ (Пока заглушка для компактности, логика та же) -->
  <main id="tab-sun" class="tab-view">
    <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Данные воскресной сетки загружаются...</div>
  </main>

  <!-- ОВЕРЛЕЙ ПОБЕДИТЕЛЯ -->
  <div class="winner-overlay" id="overlay">
    <div class="winner-box">
      <div class="w-title" id="ov-round">РЕЗУЛЬТАТ ЗАЕЗДА</div>
      <div class="w-hero" id="ov-winner">ИМЯ ПИЛОТА</div>
      <div class="w-duel">
        <div class="w-side">
          <span class="w-label win">ПРОХОДИТ ДАЛЬШЕ</span>
          <span class="w-name" id="ov-p1">Пилот 1</span>
        </div>
        <div class="w-vs">VS</div>
        <div class="w-side">
          <span class="w-label lose">В НИЖНЮЮ СЕТКУ</span>
          <span class="w-name" id="ov-p2">Пилот 2</span>
        </div>
      </div>
      <div class="timer-bar"><div class="timer-progress" id="ov-timer"></div></div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1ydV36JHtw8T00uJwsZYAxU-tCaWIrQv5yPkKpqtCtTk";
    let lastWinnerHash = {};
    let slideIndex = 0;
    let autoRotate = true;
    let overlayTimer = null;

    // Переключение главных вкладок
    function switchTab(id) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Переключение карусели ВЕРХ / НИЗ
    function manualSlide(index) {
      slideIndex = index;
      document.getElementById('slide-0').classList.toggle('active', index === 0);
      document.getElementById('slide-1').classList.toggle('active', index === 1);
      document.getElementById('btn-view-0').classList.toggle('active', index === 0);
      document.getElementById('btn-view-1').classList.toggle('active', index === 1);
    }
    
    function toggleAuto() {
      autoRotate = !autoRotate;
      document.getElementById('btn-auto').innerText = autoRotate ? "АВТО: ВКЛ" : "АВТО: ВЫКЛ";
    }

    setInterval(() => {
      if (autoRotate && document.getElementById('tab-sat').classList.contains('active')) {
        manualSlide(slideIndex === 0 ? 1 : 0);
      }
    }, 12000);

    // Очистка строки
    function clean(v) {
      if (!v) return "";
      let s = String(v).trim();
      if (s === "0" || s.includes("#N/A") || s.includes("#VALUE!")) return "";
      return s;
    }
    function isWin(v) {
      let s = clean(v).toLowerCase();
      return s === 'w' || s === '1' || s === 'в' || s === 'win';
    }

    // Универсальный парсер: Ищет колонку раунда и спускается по ней вниз, считывая блоки по 4 строки
    function parsePhase(rows, headerRegex, numMatches) {
      let result = [];
      // Находим колонку
      let startRow = -1, col = -1;
      for (let r = 0; r < rows.length; r++) {
        if (!rows[r]?.c) continue;
        for (let c = 0; c < rows[r].c.length; c++) {
          let val = clean(rows[r].c[c]?.v).replace(/\s/g, '');
          if (headerRegex.test(val)) { startRow = r; col = c; break; }
        }
        if (col !== -1) break;
      }
      
      if (col === -1) return result;

      // Считываем пары. В Google Sheets каждый пилот обычно занимает 2 строки (объединенная ячейка).
      // Шаг одной пары (2 пилота) = 4 строки.
      let r = startRow + 2; 
      for (let i = 0; i < numMatches; i++) {
        if (r + 2 >= rows.length) break;

        let p1 = clean(rows[r].c[col]?.v) || clean(rows[r+1]?.c[col]?.v);
        let w1 = isWin(rows[r].c[col+1]?.v) || isWin(rows[r+1]?.c[col+1]?.v);
        
        let p2 = clean(rows[r+2]?.c[col]?.v) || clean(rows[r+3]?.c[col]?.v);
        let w2 = isWin(rows[r+2]?.c[col+1]?.v) || isWin(rows[r+3]?.c[col+1]?.v);

        let winner = null, loser = null;
        if (w1) { winner = p1; loser = p2; }
        else if (w2) { winner = p2; loser = p1; }

        result.push({ p1: p1 || 'TBD', w1, p2: p2 || 'TBD', w2, winner, loser });
        r += 4;
      }
      return result;
    }

    // Рендер колонки
    function renderCol(containerId, title, matches, heatOffset = 1) {
      const container = document.getElementById(containerId);
      if (!container) return;
      
      let html = `<div style="font-family:'Chakra Petch'; font-size:14px; font-weight:700; color:#fff; border-bottom:2px solid var(--border-card); padding-bottom:8px;">${title}</div>`;
      
      matches.forEach((m, idx) => {
        let heatName = `Хит ${heatOffset + idx}`;
        // Проверка нового победителя для вывода оверлея
        if (m.winner && lastWinnerHash[heatName] !== m.winner) {
          if (lastWinnerHash[heatName] !== undefined) {
            showOverlay(heatName, m.winner, m.loser);
          }
          lastWinnerHash[heatName] = m.winner;
        }

        html += `
          <div class="match-card" onclick="showOverlay('${heatName}', '${m.winner || m.p1}', '${m.loser || m.p2}')">
            <div class="match-header">
              <span>${heatName}</span>
              <span>${m.winner ? 'ЗАВЕРШЕН' : 'ОЖИДАНИЕ'}</span>
            </div>
            <div class="match-row ${m.w1 ? 'winner' : ''}" style="${m.winner && !m.w1 ? 'opacity:0.5' : ''}">
              <span class="seed-box">P1</span>
              <span class="pilot-name">${m.p1}</span>
              ${m.w1 ? '<span class="win-tag">WIN</span>' : ''}
            </div>
            <div class="match-row ${m.w2 ? 'winner' : ''}" style="${m.winner && !m.w2 ? 'opacity:0.5' : ''}">
              <span class="seed-box">P2</span>
              <span class="pilot-name">${m.p2}</span>
              ${m.w2 ? '<span class="win-tag">WIN</span>' : ''}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Вызов оверлея
    function showOverlay(title, winner, loser) {
      if (winner === 'TBD') return;
      document.getElementById('ov-round').innerText = title;
      document.getElementById('ov-winner').innerText = winner;
      document.getElementById('ov-p1').innerText = winner;
      document.getElementById('ov-p2').innerText = loser || "Соперник";
      
      const overlay = document.getElementById('overlay');
      const timer = document.getElementById('ov-timer');
      
      timer.classList.remove('run');
      void timer.offsetWidth;
      timer.classList.add('run');
      overlay.classList.add('active');
      
      if (overlayTimer) clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => overlay.classList.remove('active'), 12000);
    }

    // Основной цикл синхронизации
    async function syncData() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Sat%2032DE`;
        const res = await fetch(url);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const rows = json.table.rows;

        // Извлекаем раунды по заголовкам
        const r1A = parsePhase(rows, /Раунд1А/i, 8);
        const r1B = parsePhase(rows, /Раунд1Б/i, 8);
        const r3A = parsePhase(rows, /Раунд3А/i, 4);
        const r3B = parsePhase(rows, /Раунд3[ЬБ]/i, 4);
        
        const r2A = parsePhase(rows, /Раунд2А/i, 4);
        const r2B = parsePhase(rows, /Раунд2Б/i, 4);

        // Отрисовка
        renderCol('col-R1A', 'Раунд 1А (ТОП-32)', r1A, 1);
        renderCol('col-R3A', 'Раунд 3А', r3A, 25);
        renderCol('col-R3B', 'Раунд 3Б', r3B, 29);
        renderCol('col-R1B', 'Раунд 1Б (ТОП-32)', r1B, 9);
        
        renderCol('col-R2A', 'Нижняя сетка 2А', r2A, 17);
        renderCol('col-R2B', 'Нижняя сетка 2Б', r2B, 21);

        // УМНЫЙ ЗУМ: Если Раунд 1 полностью завершен, скрываем его!
        const r1Finished = r1A.every(m => m.winner) && r1B.every(m => m.winner);
        if (r1Finished) {
          document.getElementById('col-R1A').style.display = 'none';
          document.getElementById('col-R1B').style.display = 'none';
          document.getElementById('sat-winners-layout').style.transform = 'scale(1.1)';
          document.getElementById('sat-winners-layout').style.transformOrigin = 'top center';
        }

      } catch (e) {
        console.warn("Синхронизация...", e);
      }
    }

    // Запуск
    window.addEventListener('DOMContentLoaded', () => {
      syncData();
      setInterval(syncData, 3000); // Опрос каждые 3 секунды
    });
  </script>
</body>
</html>
