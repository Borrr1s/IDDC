<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Drift Bracket | Matsuri SPB x Igora Drive</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-red: #e60000;
            --panel-bg: #1a1a1a;
            --text-main: #ffffff;
        }
        body { 
            margin: 0; 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
        }
        .header { 
            text-align: center; 
            padding: 25px; 
            background: #000; 
            border-bottom: 4px solid var(--accent-red); 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tabs { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin: 30px 0; 
        }
        .tab-btn { 
            background: var(--panel-bg); 
            color: #fff; 
            border: 2px solid #333; 
            padding: 12px 40px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 800; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        .tab-btn.active, .tab-btn:hover { 
            border-color: var(--accent-red); 
            background: var(--accent-red); 
            box-shadow: 0 0 15px rgba(230, 0, 0, 0.5);
        }
        
        .bracket-container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }
        .match { 
            background: var(--panel-bg); 
            padding: 15px 25px; 
            border-left: 5px solid #444; 
            width: 350px; 
            border-radius: 0 8px 8px 0;
            transition: border-color 0.3s;
        }
        .match.finished { 
            border-left-color: var(--accent-red); 
        }
        .pilot { 
            padding: 8px 0; 
            font-size: 18px; 
            display: flex;
            justify-content: space-between;
        }
        .pilot.winner { 
            font-weight: 800; 
            color: var(--accent-red); 
        }

        /* Анимированная плашка */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            display: none; 
            align-items: center; justify-content: center; 
            z-index: 999; 
            opacity: 0; 
            transition: opacity 0.3s; 
        }
        .overlay.show { 
            display: flex; 
            opacity: 1; 
        }
        .popup { 
            text-align: center; 
            background: linear-gradient(145deg, #111 0%, #222 100%); 
            border: 4px solid var(--accent-red); 
            padding: 60px 80px; 
            box-shadow: 0 0 50px rgba(230, 0, 0, 0.6); 
            transform: scale(0.8);
        }
        .overlay.show .popup { 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .popup h1 { 
            font-size: 56px; margin: 0 0 20px 0; 
            text-transform: uppercase; letter-spacing: 4px; 
        }
        .popup h2 { 
            font-size: 42px; color: var(--accent-red); margin: 0; 
            font-weight: 800;
        }
        .popup .loser { 
            font-size: 24px; color: #666; text-decoration: line-through; 
            margin-top: 20px; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>DRIFT MATSURI SPB <span style="color: var(--accent-red)">x</span> ИГОРА ДРАЙВ</h1>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="setDay('Сетка')">Суббота / Воскресенье</button>
</div>

<div class="bracket-container" id="bracket">
    <!-- Сюда будут выводиться распарсенные матчи -->
    <div style="color: #666; text-align: center;">Ожидание данных из Google Sheets API...</div>
</div>

<div class="overlay" id="overlay">
    <div class="popup" id="popup">
        <h1>ПОБЕДА!</h1>
        <h2 id="win-name">ПИЛОТ 1</h2>
        <div class="loser" id="lose-name">Пилот 2 выбывает</div>
    </div>
</div>

<script>
    // --- ТВОИ ДАННЫЕ ДЛЯ API ---
    const SHEET_ID = '1ydV36JHtw8T00uJwsZYAxU-tCaWIrQv5yPkKpqtCtTk';
    const API_KEY = 'ВСТАВЬ_СЮДА_СВОЙ_API_KEY';
    // Название листа в таблице (обычно 'Лист1' или 'Сетка')
    const SHEET_NAME = 'Сетка'; 
    const RANGE = `${SHEET_NAME}!A1:AD100`; // Диапазон чтения
    const API_URL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;

    let knownWinners = new Set();
    let isPopupActive = false;

    // "Хрупкий" парсер: ищем паттерны вида
    // row i:   [..., "Фамилия 1", "w" или пусто, ...]
    // row i+1: [..., пустая строка для объединения, ...]
    // row i+2: [..., "Фамилия 2", "w" или пусто, ...]
    function parseRawGrid(rows) {
        let matches = [];
        
        // Перебираем строки (шаг 2, так как между пилотами обычно 1 пустая/объединенная строка)
        for (let r = 0; r < rows.length - 2; r++) {
            let row1 = rows[r] || [];
            let row2 = rows[r+2] || []; // Пилот 2 обычно через строчку ниже
            
            // Ищем имена пилотов в колонках (например, с 3 по 25, где идут заезды)
            for (let c = 2; c < 28; c++) {
                let p1 = row1[c];
                let p2 = row2[c];

                // Если нашли похожих на пилотов (например, test1, test32)
                if (p1 && p2 && p1.toString().includes('test') && p2.toString().includes('test')) {
                    
                    // Ищем букву 'w' справа от имени пилота (колонка c+1 или c+2 из-за объединений)
                    let w1 = (row1[c+1] === 'w' || row1[c+2] === 'w');
                    let w2 = (row2[c+1] === 'w' || row2[c+2] === 'w');
                    
                    let winner = null;
                    let loser = null;

                    if (w1) { winner = p1; loser = p2; }
                    if (w2) { winner = p2; loser = p1; }

                    // Генерируем уникальный ID для пары, чтобы не дублировать
                    let matchId = `${p1}_vs_${p2}_col${c}`;
                    
                    matches.push({
                        id: matchId,
                        p1: p1,
                        p2: p2,
                        winner: winner,
                        loser: loser
                    });
                }
            }
        }
        return matches;
    }

    async function fetchData() {
        if (API_KEY === 'ВСТАВЬ_СЮДА_СВОЙ_API_KEY') {
            console.warn("Вставь API KEY в код!");
            return [];
        }
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            if (!data.values) return [];
            
            return parseRawGrid(data.values);
        } catch (e) {
            console.error("Ошибка API:", e);
            return [];
        }
    }

    async function updateBracket() {
        if(isPopupActive) return; // Не обновляем пока висит плашка

        const matches = await fetchData();
        if(!matches.length) return;

        let newWinnerData = null;

        matches.forEach(m => {
            if (m.winner) {
                let winKey = m.id + "_" + m.winner;
                if (!knownWinners.has(winKey)) {
                    knownWinners.add(winKey);
                    // Берем первого найденного нового победителя
                    if (!newWinnerData) newWinnerData = m;
                }
            }
        });

        renderBracket(matches);

        if (newWinnerData) {
            showPopup(newWinnerData.winner, newWinnerData.loser);
        }
    }

    function renderBracket(matches) {
        const container = document.getElementById('bracket');
        container.innerHTML = ''; 
        
        // Убираем дубликаты пар для отрисовки списка
        let renderedIds = new Set();

        matches.forEach(m => {
            if (renderedIds.has(m.id)) return;
            renderedIds.add(m.id);

            const isP1Winner = m.winner === m.p1;
            const isP2Winner = m.winner === m.p2;
            const isFinished = !!m.winner;

            const matchEl = document.createElement('div');
            matchEl.className = `match ${isFinished ? 'finished' : ''}`;
            matchEl.innerHTML = `
                <div class="pilot ${isP1Winner ? 'winner' : ''}">${m.p1} ${isP1Winner ? '<span style="color:var(--accent-red)">WIN</span>' : ''}</div>
                <div class="pilot ${isP2Winner ? 'winner' : ''}">${m.p2} ${isP2Winner ? '<span style="color:var(--accent-red)">WIN</span>' : ''}</div>
            `;
            container.appendChild(matchEl);
        });
    }

    function showPopup(winner, loser) {
        isPopupActive = true;
        const overlay = document.getElementById('overlay');
        document.getElementById('win-name').innerText = winner;
        document.getElementById('lose-name').innerText = loser + ' выбывает';
        
        overlay.classList.add('show');
        setTimeout(() => {
            overlay.classList.remove('show');
            isPopupActive = false;
        }, 5000); // Плашка 5 секунд
    }

    // Опрашиваем таблицу каждые 7 секунд
    setInterval(updateBracket, 7000);
    updateBracket();
</script>
</body>
</html>
